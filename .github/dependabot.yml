version: 2
updates:
  # Monitor Python dependencies (uses uv under the hood; updates pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Batch all minor/patch bumps (direct + transitive) into a single weekly PR
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Major bumps stay individual so each can be reviewed on its own
      python-major:
        update-types:
          - "major"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images: the uv build stage and python. Monthly: these are build
  # tools, and an old uv in the image can reject a uv.lock written by a newer one
  # (the Dockerfile runs `uv export --locked`). Python's minor version is the
  # image's runtime and is chosen by hand; the -slim tag already floats patches.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker:
        applies-to: version-updates
        patterns:
          - "*"
