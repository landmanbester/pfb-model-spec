name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      SKIP_CHECKS: 'false'
    steps:
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
            echo "Skipping checks because [skip checks] was found in the commit message."
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        if: env.SKIP_CHECKS != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        if: env.SKIP_CHECKS != 'true'
        run: uv sync --group dev

      - name: Check code formatting
        if: env.SKIP_CHECKS != 'true'
        run: uv run ruff format --check .

      - name: Lint code
        if: env.SKIP_CHECKS != 'true'
        run: uv run ruff check .

  test:
    # Job names are what branch protection requires: Tests (3.11), Tests (3.14),
    # Tests (3.14, arm64), plus Lightweight install (3.10) below.
    name: Tests (${{ matrix.python-version }}${{ matrix.arch-label }})
    runs-on: ${{ matrix.os }}
    env:
      SKIP_CHECKS: 'false'
      # Without this, uv obeys .python-version (3.11) and the matrix is cosmetic.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python the full install supports: code that passes
        # both rarely breaks in between. 3.10 supports only the lightweight
        # install and is covered by the `lightweight` job.
        python-version: ["3.11", "3.14"]
        os: [ubuntu-latest]
        include:
          # One arm64 job, matching the arm64 image publish-container builds. It
          # catches a dependency without an aarch64 wheel before merge.
          - os: ubuntu-24.04-arm
            python-version: "3.14"
            arch-label: ", arm64"

    steps:
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
            echo "Skipping checks because [skip checks] was found in the commit message."
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        if: env.SKIP_CHECKS != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-py${{ matrix.python-version }}-
            ${{ runner.os }}-${{ runner.arch }}-uv-

      - name: Install dependencies
        if: env.SKIP_CHECKS != 'true'
        run: uv sync --extra full --group test

      - name: Run tests
        if: env.SKIP_CHECKS != 'true'
        run: uv run --extra full pytest -v

  # Python 3.10 supports ONLY the lightweight install: the CLI plus hip-cargo's
  # container fallback, no `full` extra. `pfbspec --help` imports every
  # cli/ module, so a heavy top-level import there fails this job. Its Python
  # must equal the requires-python floor.
  lightweight:
    name: Lightweight install (3.10)
    runs-on: ubuntu-latest
    env:
      SKIP_CHECKS: 'false'
    steps:
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
            echo "Skipping checks because [skip checks] was found in the commit message."
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install base package (no extras)
        if: env.SKIP_CHECKS != 'true'
        run: |
          uv venv --python 3.10
          uv pip install .

      - name: Smoke test CLI
        if: env.SKIP_CHECKS != 'true'
        run: uv run --no-sync pfbspec --help
