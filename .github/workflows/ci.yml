name: CI

# Pull requests only. A push to main is the merge of a PR that already passed
# here, so re-running the suite after merge buys nothing (and the update-cabs
# bot commit only regenerates cabs). PRs into another branch get no run, to
# save CI minutes; opt in by naming a long-lived integration branch dev-*
# (each with its own PR into main), or for any branch on demand:
#   gh workflow run ci.yml --ref <branch>
on:
  pull_request:
    branches: [ main, 'dev-*' ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Lint code
        run: uv run ruff check .

  test:
    # Job names are what branch protection requires: Tests (3.11), Tests (3.14),
    # Tests (3.14, arm64), plus Lightweight install (3.10) below.
    name: Tests (${{ matrix.python-version }}${{ matrix.arch-label }})
    runs-on: ${{ matrix.os }}
    env:
      # Without this, uv obeys .python-version (3.11) and the matrix is cosmetic.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python the full install supports: code that passes
        # both rarely breaks in between. 3.10 supports only the lightweight
        # install and is covered by the `lightweight` job.
        python-version: ["3.11", "3.14"]
        os: [ubuntu-latest]
        include:
          # One arm64 job, matching the arm64 image publish-container builds. It
          # catches a dependency without an aarch64 wheel before merge.
          - os: ubuntu-24.04-arm
            python-version: "3.14"
            arch-label: ", arm64"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-py${{ matrix.python-version }}-
            ${{ runner.os }}-${{ runner.arch }}-uv-

      - name: Install dependencies
        run: uv sync --extra full --group test

      - name: Run tests
        run: uv run --extra full pytest -v

  # Python 3.10 supports ONLY the lightweight install: the CLI plus hip-cargo's
  # container fallback, no `full` extra. `pfbspec --help` imports every
  # cli/ module, so a heavy top-level import there fails this job. Its Python
  # must equal the requires-python floor.
  lightweight:
    name: Lightweight install (3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install base package (no extras)
        run: |
          uv venv --python 3.10
          uv pip install .

      - name: Smoke test CLI
        run: uv run --no-sync pfbspec --help
