name: Publish Container

on:
  push:
    tags:
      - 'v*.*.*'  # releases: tbump points CONTAINER_IMAGE and the cabs at :<version>
    branches:
      - main
  # Feature branches are built on demand only, never on PR pushes:
  #   gh workflow run publish-container.yml --ref <branch>
  # The image is tagged with the branch name, slashes replaced by dashes (feat/x -> :feat-x).
  workflow_dispatch:

# Cab generation is handled by pre-commit hooks locally.
# This workflow only builds and pushes container images (stimela pulls the image
# named in the cab definitions).

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for container
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For version tags: v0.2.0 -> 0.2.0, v0.2.0rc1 -> 0.2.0rc1
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            # For a manual run on a feature branch: the sanitised branch name (feat/x -> feat-x)
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
            # For main branch: use 'latest'
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
